<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bazcar</title>
<link rel="icon" href="data:,">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: #141413; --surface: #1c1c1a; --surface2: #262624; --text: #ececea;
    --muted: #9a9891; --line: rgba(255,255,255,.08); --accent: #d97757;
    --accent-ink: #fff; --good: #8ba888; --warn: #c9a227; --bad: #c96a54;
    color-scheme: dark;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 15px/1.5 ui-sans-serif, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    padding: 16px 14px 48px; max-width: 860px; margin: 0 auto;
    font-variant-numeric: tabular-nums;
  }
  header.top { margin: 6px 0 14px; }
  header.top h1 { font-size: 21px; font-weight: 650; letter-spacing: -.01em; }
  header.top .sub { color: var(--muted); font-size: 12.5px; margin-top: 2px; }
  .tabs {
    display: flex; gap: 2px; background: var(--surface);
    border: 1px solid var(--line); border-radius: 11px; padding: 3px;
    margin-bottom: 16px; position: sticky; top: 0; z-index: 5;
  }
  .tab {
    flex: 1; background: transparent; border: 0; color: var(--muted);
    padding: 8px 6px; border-radius: 8px; font-size: 13px; cursor: pointer;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .tab.active { background: var(--surface2); color: var(--text); box-shadow: inset 0 0 0 1px var(--line); }
  .card {
    background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
    padding: 14px 15px;
  }
  .section { margin-top: 18px; }
  .section > h2 { font-size: 13px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 10px; }
  .kpis { display: flex; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 0; }
  .kpi { flex: 1; text-align: center; }
  .kpi + .kpi { border-left: 1px solid var(--line); }
  .kpi .num { font-size: 22px; font-weight: 650; }
  .kpi .lbl { color: var(--muted); font-size: 11.5px; margin-top: 2px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  td, th { padding: 8px 6px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
  tr:last-child td { border-bottom: 0; }
  th { color: var(--muted); font-weight: 600; font-size: 11.5px; text-transform: uppercase; letter-spacing: .05em; }
  a { color: var(--text); text-decoration: underline; text-decoration-color: var(--accent); text-underline-offset: 3px; }
  .muted { color: var(--muted); }
  .badge { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 11.5px; font-weight: 600; border: 1px solid var(--line); }
  .b-wait { color: var(--muted); }
  .b-score { color: var(--good); border-color: currentColor; }
  .b-part { color: var(--bad); border-color: currentColor; }
  .b-drop { color: var(--good); border-color: currentColor; }
  .b-warn { color: var(--warn); border-color: currentColor; }
  .btn {
    background: transparent; border: 1px solid var(--line); color: var(--text);
    padding: 6px 12px; border-radius: 8px; cursor: pointer; font-size: 13px;
  }
  .btn:disabled { opacity: .35; cursor: default; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .btn.on { border-color: var(--accent); color: var(--accent); }
  .mini {
    background: transparent; border: 1px solid var(--line); color: var(--text);
    border-radius: 8px; padding: 4px 10px; cursor: pointer; font-size: 13px;
  }
  .mini.on { border-color: var(--accent); color: var(--accent); }
  .tgl { background: transparent; border: 1px solid var(--line); color: var(--text); border-radius: 999px; padding: 4px 13px; cursor: pointer; font-size: 13px; }
  .tgl.on { border-color: var(--good); color: var(--good); }
  .rowbtn { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .kv { display: flex; justify-content: space-between; gap: 12px; padding: 6px 0; border-bottom: 1px solid var(--line); font-size: 13.5px; }
  .kv:last-child { border-bottom: 0; }
  .kv .k { color: var(--muted); flex-shrink: 0; }
  .kv .v { text-align: right; }
  .trend-down { color: var(--good); } .trend-up { color: var(--bad); }
  .spark { display: flex; align-items: flex-end; gap: 3px; height: 40px; margin-top: 8px; }
  .spark div { flex: 1; background: var(--accent); border-radius: 2px 2px 0 0; min-height: 2px; opacity: .8; }
  .hist { display: flex; align-items: flex-end; gap: 3px; height: 54px; margin: 10px 0 4px; }
  .hist div { flex: 1; background: var(--accent); border-radius: 2px 2px 0 0; min-height: 3px; opacity: .8; }
  .bars .row { display: flex; align-items: center; gap: 8px; margin: 6px 0; font-size: 12.5px; }
  .bars .row .lab { width: 88px; color: var(--muted); text-align: right; flex-shrink: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bars .track { flex: 1; background: var(--surface2); border-radius: 5px; height: 12px; overflow: hidden; }
  .bars .fill { height: 100%; background: var(--accent); border-radius: 5px; opacity: .85; }
  .bars .val { width: 40px; text-align: right; color: var(--muted); }
  .q-item { border-bottom: 1px solid var(--line); padding: 10px 0; }
  .q-item:last-child { border-bottom: 0; }
  .q-item .crit { font-weight: 600; font-size: 13.5px; }
  .q-item .meta { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .prog { background: var(--surface2); border-radius: 5px; height: 8px; overflow: hidden; margin-top: 6px; }
  .prog .fill { height: 100%; background: var(--good); }
  .err { background: var(--surface); border: 1px solid var(--bad); padding: 12px 14px; border-radius: 10px; margin-top: 10px; }
  .toolbar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
  .toolbar input, .toolbar select, .field input {
    background: var(--surface); border: 1px solid var(--line); color: var(--text);
    border-radius: 9px; padding: 8px 11px; font-size: 13.5px; max-width: 100%;
  }
  input, select, textarea {
    background: var(--surface2); border: 1px solid var(--line); color: var(--text);
    border-radius: 9px; padding: 8px 11px; font-size: 13.5px; max-width: 100%;
  }
  input::placeholder, textarea::placeholder { color: var(--muted); opacity: .8; }
  input[type="range"] { padding: 0; border: 0; background: transparent; accent-color: var(--accent); }
  select option { background: var(--surface2); color: var(--text); }
  .toolbar input[type="search"] { flex: 1 1 160px; }
  .toolbar input.num { width: 92px; }
  .filters { display: flex; gap: 8px; flex-wrap: wrap; margin: -4px 0 12px; }
  .item { display: flex; flex-direction: column; gap: 8px; padding: 12px 0; border-bottom: 1px solid var(--line); }
  .item:last-child { border-bottom: 0; }
  .item .title { font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item .toprow { min-width: 0; }
  .item .botrow { display: flex; gap: 12px; align-items: flex-start; }
  .item .photo-col { display: flex; flex-direction: column; align-items: center; gap: 5px; flex-shrink: 0; width: 72px; }
  .item img.thumb { width: 72px; height: 72px; object-fit: cover; border-radius: 10px; background: var(--surface2); }
  .item .photo-col .badge { font-size: 11px; padding: 0 7px; }
  .item .body { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .item .specs { color: var(--muted); font-size: 12.5px; margin-top: 2px; }
  .item .side { flex-shrink: 0; display: flex; flex-direction: column; align-items: flex-end; justify-content: flex-end; gap: 6px; align-self: stretch; }
  .item .price { font-weight: 700; font-size: 15.5px; white-space: nowrap; }
  .iconbtns { display: flex; gap: 6px; }
  .dual { position: relative; height: 34px; margin: 2px 0 0; }
  .dual input[type="range"] {
    -webkit-appearance: none; appearance: none;
    position: absolute; left: 0; right: 0; top: 0; width: 100%; height: 34px;
    margin: 0; padding: 0; border: 0; background: transparent; pointer-events: none;
  }
  .dual input[type="range"]::-webkit-slider-runnable-track { background: transparent; height: 34px; }
  .dual input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none; pointer-events: auto;
    width: 22px; height: 22px; margin-top: 6px; border-radius: 50%;
    background: var(--text); border: 2px solid var(--accent); cursor: pointer;
  }
  .dual input[type="range"]::-moz-range-track { background: transparent; height: 34px; }
  .dual input[type="range"]::-moz-range-thumb {
    pointer-events: auto; width: 18px; height: 18px; border-radius: 50%;
    background: var(--text); border: 2px solid var(--accent); cursor: pointer;
  }
  .dual .fill { position: absolute; top: 15px; height: 4px; background: var(--accent); border-radius: 2px; opacity: .9; }
  .dual .track { position: absolute; top: 15px; left: 0; right: 0; height: 4px; background: var(--surface2); border-radius: 2px; }
  .sliderow { margin: 4px 0 10px; }
  .sliderow .lab { display: flex; justify-content: space-between; font-size: 12.5px; color: var(--muted); margin-bottom: 2px; }
  .sliderow .lab b { color: var(--text); font-weight: 600; }
  .dayrow { display: flex; align-items: center; gap: 10px; }
  .dayrow input[type="range"] { flex: 1; }
  .dayrow .lab { font-size: 13px; color: var(--muted); white-space: nowrap; }
  .dayrow .lab b { color: var(--text); }
  .toptools { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
  .toptools .spacer { flex: 1; }
  .moretag { text-align: center; color: var(--muted); font-size: 12.5px; padding: 10px 0 2px; }
  .gallery { margin: 10px 0 4px; }
  .gallery .main { width: 100%; border-radius: 10px; max-height: 340px; object-fit: cover; display: block; background: var(--surface2); }
  .gallery .thumbs { display: flex; gap: 6px; margin-top: 8px; overflow-x: auto; }
  .gallery .thumbs img { height: 56px; border-radius: 8px; cursor: pointer; border: 2px solid transparent; }
  .gallery .thumbs img.sel { border-color: var(--accent); }
  .desc { font-size: 13.5px; white-space: pre-wrap; margin-top: 8px; }
  .desc.clamp { display: -webkit-box; -webkit-line-clamp: 6; -webkit-box-orient: vertical; overflow: hidden; }
  .skel { background: linear-gradient(90deg, var(--surface) 25%, var(--surface2) 50%, var(--surface) 75%); background-size: 200% 100%; animation: sh 1.2s infinite; border-radius: 10px; height: 64px; margin-bottom: 8px; }
  @keyframes sh { to { background-position: -200% 0; } }
  .cmp-scroll { overflow-x: auto; }
  .cmp-table { min-width: 640px; }
  .cmp-table td:first-child { color: var(--muted); width: 110px; }
  .switch { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 13.5px; }
  .switch:last-child { border-bottom: 0; }
  .pager { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; align-items: center; }
  .pager .count { color: var(--muted); font-size: 12.5px; margin-left: auto; }
  #totop {
    display: none; position: fixed; right: 16px; bottom: 20px; z-index: 6;
    width: 44px; height: 44px; border-radius: 50%;
    background: var(--surface2); border: 1px solid var(--line); color: var(--text);
    font-size: 18px; cursor: pointer; box-shadow: 0 2px 10px rgba(0,0,0,.4);
  }
  #loading { color: var(--muted); margin-top: 20px; }
</style>
</head>
<body>
<header class="top">
  <h1>Bazcar</h1>
  <div class="sub">Live catalog · your profile</div>
</header>
<div class="tabs">
  <button class="tab active" data-view="listings">Listings</button>
  <button class="tab" data-view="saved">Saved</button>
  <button class="tab" data-view="insights">Insights</button>
  <button class="tab" data-view="profile">Profile</button>
</div>
<div id="loading">Loading…</div>
<div id="content"></div>
<button id="totop" onclick="scrollTop()" aria-label="Scroll to top">↑</button>

<script>
const tg = window.Telegram && window.Telegram.WebApp;
const Haptic = tg && tg.HapticFeedback;
if (tg) {
  tg.ready(); tg.expand();
  try { if (tg.disableVerticalSwipes) tg.disableVerticalSwipes(); } catch (e) {}
  try {
    // Adopt the native Telegram theme when provided (warm dark/light handled
    // by Telegram); otherwise keep the bundled warm-minimal theme.
    const p = tg.themeParams || {};
    if (p.bg_color) {
      const root = document.documentElement.style;
      root.setProperty("--bg", p.bg_color);
      if (p.secondary_bg_color) {
        root.setProperty("--surface", p.secondary_bg_color);
        root.setProperty("--surface2", p.secondary_bg_color);
      }
      if (p.text_color) root.setProperty("--text", p.text_color);
      if (p.hint_color) root.setProperty("--muted", p.hint_color);
      if (p.button_color) root.setProperty("--accent", p.button_color);
    }
  } catch (e) { /* keep defaults */ }
}
const initData = tg ? tg.initData : "";
const content = document.getElementById("content");
const loading = document.getElementById("loading");
let currentView = "listings";
let invPage = 0, invDays = 30;
let inv = { q: "", sort: "newest", status: "all", min_price: "", max_price: "", min_year: "", max_year: "" };
let showFilters = false;
let compareIds = [];
let lastCompareIds = [];
let lastCompareFrom = "listings";
let savedIds = new Set();
let lastRetry = () => load("listings");
// Legacy tab/view names keep working (old links, cached pages).
const VIEW_ALIASES = { overview: "insights", stats: "insights", queue: "insights", inventory: "listings", profiles: "profile" };
const KNOWN_VIEWS = ["listings", "saved", "insights", "profile"];

if (window.addEventListener) {
  window.addEventListener("scroll", () => {
    const b = document.getElementById("totop");
    if (b) b.style.display = (window.scrollY || 0) > 600 ? "block" : "none";
  }, { passive: true });
}
function scrollTop() {
  try { window.scrollTo({ top: 0, behavior: "smooth" }); }
  catch (e) { window.scrollTo(0, 0); }
}
function buzz(kind) {  try {
    if (!Haptic) return;
    if (kind === "ok") Haptic.notificationOccurred("success");
    else if (kind === "err") Haptic.notificationOccurred("error");
    else Haptic.selectionChanged();
  } catch (e) {}
}
function toast(msg) {
  try {
    if (tg && tg.showAlert) { tg.showAlert(msg); return; }
  } catch (e) {}
  try { alert(msg); } catch (e) {}
}
function extUrl(u) {
  return typeof u === "string" && /^(https?:\/\/)/i.test(u);
}
document.addEventListener("click", e => {
  // Route external links through Telegram's opener inside the Mini App;
  // block anything that is not http(s) coming from ad data.
  const a = e.target && e.target.closest ? e.target.closest("a[href]") : null;
  if (!a) return;
  const href = a.getAttribute("href") || "";
  if (!extUrl(href)) { e.preventDefault(); return; }
  if (tg && tg.openLink) {
    e.preventDefault();
    try { tg.openLink(href); } catch (err) { window.open(href, "_blank", "noopener"); }
  }
});
function setBack(fn) {
  if (!tg || !tg.BackButton) return;
  try {
    if (fn) { tg.BackButton.show(); tg.BackButton.onClick(fn); }
    else { tg.BackButton.hide(); }
  } catch (e) {}
}
function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"]/g,
    c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
}
function eur(v) {
  if (v == null || v === "") return "Ask";
  return Number(v).toLocaleString("sk-SK").replace(/,/g, " ") + " €";
}
function km(v) { return v == null ? "? km" : Number(v).toLocaleString("sk-SK") + " km"; }
function fmtKmK(v) {
  if (v == null) return "?";
  const n = Number(v);
  if (!isFinite(n)) return "?";
  return n >= 1000 ? Math.round(n / 1000) + "K km" : n + " km";
}
function fmtDateDM(v) {  // Any date-ish value -> "dd.mm." (Slovak short date). Returns "" when unknown.
  if (v == null || v === "") return "";
  const m = String(v).match(/(\d{4})-(\d{2})-(\d{2})/);
  if (m) return `${m[3]}.${m[2]}.`;
  const d = new Date(v);
  if (isNaN(d.getTime())) return "";
  return String(d.getDate()).padStart(2, "0") + "." + String(d.getMonth() + 1).padStart(2, "0") + ".";
}
function ago(iso) {
  if (!iso) return "never";
  const s = Math.max(0, (Date.now() - new Date(iso).getTime()) / 1000);
  if (s < 120) return "just now";
  if (s < 3600) return Math.floor(s/60) + " min ago";
  if (s < 86400) return Math.floor(s/3600) + " h ago";
  const d = Math.floor(s/86400);
  if (d < 30) return d + " d ago";
  if (d < 365) return Math.floor(d/30) + " mo ago";
  return Math.floor(d/365) + " y ago";
}
function scopeLabel(f) {
  // Short human label for a scrape-filter set (pure, unit-tested).
  if (!f) return "defaults";
  const keys = Object.keys(f).filter(k => f[k] !== "" && f[k] != null);
  if (!keys.length) return "whole catalog";
  const num = v => (v === "" || v == null ? null : v);
  const parts = [];
  if (f.query) parts.push(`"${f.query}"`);
  const lo = num(f.min_price), hi = num(f.max_price);
  if (lo != null || hi != null) parts.push(`€${lo ?? "…"}–${hi ?? "…"}`);
  if (f.psc) parts.push(f.psc + (num(f.distance_km) != null ? ` +${f.distance_km} km` : ""));
  return parts.join(" · ") || "custom";
}
function staleBadge(iso) {
  if (!iso) return "";
  const d = Math.floor(Math.max(0, Date.now() - new Date(iso).getTime()) / 86400000);
  return d > 7 ? ` <span class="badge b-warn">${d} d unseen</span>` : "";
}
function spark(counts) {
  if (!counts.length) return '<div class="muted">no data</div>';
  const max = Math.max(...counts, 1);
  return '<div class="spark">' + counts.map(c =>
    `<div style="height:${Math.max(5, Math.round(c / max * 100))}%"></div>`).join("") + "</div>";
}
function bars(rows, labKey, valKey, fmtVal) {
  const total = rows.reduce((s, r) => s + (Number(r[valKey]) || 0), 0) || 1;
  return '<div class="bars">' + rows.map(r => {
    const v = Number(r[valKey]) || 0;
    const lab = fmtVal ? fmtVal(r) : r[labKey];
    return `<div class="row"><span class="lab">${esc(String(lab)).slice(0, 22)}</span>` +
      `<div class="track"><div class="fill" style="width:${Math.round(v/total*100)}%"></div></div>` +
      `<span class="val">${v}</span></div>`;
  }).join("") + "</div>";
}
function scoreBadge(score, isCar) {
  if (score == null) return '<span class="badge b-wait">unscored</span>';
  if (isCar === false) return '<span class="badge b-part">part</span>';
  return `<span class="badge b-score">${score}</span>`;
}
function badge(row) {
  return scoreBadge(row.score, row.is_car);
}
function skeleton(n) {
  loading.style.display = "none";
  content.innerHTML = Array.from({length: n || 3}, () => '<div class="skel"></div>').join("");
}
function showErr(html, retry) {
  loading.style.display = "none";
  if (retry) lastRetry = retry;
  content.innerHTML = '<div class="err">' + html + "</div>" +
    '<div class="rowbtn"><button class="mini" onclick="lastRetry()">Try again</button></div>';
  buzz("err");
}

async function get(params) {
  try {
    const resp = await fetch("/api/webapp?" + params.toString(), {
      headers: { "X-Telegram-Init-Data": initData }
    });
    if (resp.status === 401) {
      showErr("Open the dashboard via the /dashboard button in the bot — " +
        "direct browser access is not allowed.");
      return null;
    }
    return await resp.json();
  } catch (e) {
    showErr("Load failed: " + esc(e.message));
    return null;
  }
}
async function post(action, fields) {
  try {
    const resp = await fetch("/api/webapp", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "X-Telegram-Init-Data": initData
      },
      body: JSON.stringify(Object.assign({ action }, fields || {}))
    });
    if (resp.status === 401) {
      showErr("Session expired — reopen the dashboard via /dashboard in the bot.");
      return null;
    }
    return await resp.json();
  } catch (e) {
    showErr("Save failed: " + esc(e.message));
    return null;
  }
}

function markTab(view) {
  document.querySelectorAll(".tab").forEach(t =>
    t.classList.toggle("active", t.dataset.view === view));
}
async function load(view) {
  view = VIEW_ALIASES[view] || view;
  if (!KNOWN_VIEWS.includes(view)) view = "listings";
  currentView = view;
  markTab(view);
  setBack(null);
  buzz();
  skeleton(3);
  content.innerHTML = "";
  const params = new URLSearchParams({ view });
  if (view === "listings") {
    invPage = 0;
    loadingMore = false;
    if (listObserver) { listObserver.disconnect(); listObserver = null; }
    const lp = buildListParams();
    lp.forEach((v, k) => params.set(k, v));
  } else if (view === "insights") {
    params.set("view", "insights");
  }
  lastRetry = () => load(view);
  const data = await get(params);
  if (data == null) return;
  loading.style.display = "none";
  if (data.error && view !== "listing") { showErr(esc(data.error)); return; }
  if (view === "listings") renderListings(data);
  else if (view === "saved") renderSaved(data);
  else if (view === "insights") renderInsightsFull(data);
  else if (view === "profile") renderProfile(data);
}
async function renderInsightsFull(d) {
  renderInsights(d);
  try {
    const [h, dg, sc] = await Promise.all([
      get(new URLSearchParams({ view: "health" })),
      get(new URLSearchParams({ view: "digest" })),
      get(new URLSearchParams({ view: "scraper" })),
    ]);
    if (currentView !== "insights") return;

function numOr(v, fb) {

async function ensureBounds() {
  const key = `${inv.q}|${inv.status}|${invDays}`;
  if (boundsCache && boundsCache.key === key) return boundsCache.bounds;
  const params = new URLSearchParams({ view: "bounds", days: invDays, status: inv.status });
  if (inv.q) params.set("q", inv.q);
  const data = await get(params);
  const b = (data && data.bounds) || null;

function mountDual(elId, labId, o) {
  const el = document.getElementById(elId);
  if (!el || o.max <= o.min) return;
  const lo = Math.min(o.lo, o.hi), hi = Math.max(o.lo, o.hi);
  el.innerHTML = `<div class="track"></div><div class="fill" id="${elId}-f"></div>` +
    `<input type="range" id="${elId}-a" min="${o.min}" max="${o.max}" step="${o.step}" value="${lo}">` +
    `<input type="range" id="${elId}-b" min="${o.min}" max="${o.max}" step="${o.step}" value="${hi}">`;
  const paint = () => {
    const a = document.getElementById(elId + "-a"), b = document.getElementById(elId + "-b");
    if (!a || !b) return;
    const x = Math.min(+a.value, +b.value), y = Math.max(+a.value, +b.value);
    const f = document.getElementById(elId + "-f");
    const span = (o.max - o.min) || 1;
    if (f) { f.style.left = ((x - o.min) / span * 100) + "%"; f.style.width = ((y - x) / span * 100) + "%"; }
    const lab = document.getElementById(labId);
    if (lab) lab.textContent = o.fmt(x) + " – " + o.fmt(y);
  };
  const commit = () => {
    const a = document.getElementById(elId + "-a"), b = document.getElementById(elId + "-b");
    if (!a || !b) return;
    o.onLo(Math.min(+a.value, +b.value));
    o.onHi(Math.max(+a.value, +b.value));
    paint();
    scheduleReload();
  };
  el.querySelectorAll("input").forEach(i => {
    i.addEventListener("input", paint);
    i.addEventListener("change", commit);
  });
  paint();
}
async function refreshBounds() {
  const b = await ensureBounds();
  if (currentView !== "listings" || !showFilters) return;
  if (!b || b.n === 0) {
    const plo = document.getElementById("plo");
    if (plo) plo.innerHTML = '<div class="muted">No data for these filters.</div>';
    return;
  }
  const pMin = b.min_price != null ? b.min_price : 0;
  const pMax = b.max_price != null ? b.max_price : pMin + 1000;
  const yMin = b.min_year != null ? b.min_year : 2000;
  const yMax = b.max_year != null ? b.max_year : yMin;
  mountDual("plo", "plo-lab", {
    min: pMin, max: Math.max(pMax, pMin + 1), step: 50,
    lo: numOr(inv.min_price, pMin), hi: numOr(inv.max_price, Math.max(pMax, pMin + 1)),
    fmt: v => eur(v),
    onLo: v => { inv.min_price = v <= pMin ? "" : v; },
    onHi: v => { inv.max_price = v >= pMax ? "" : v; },
  });
  mountDual("yla", "yla-lab", {
    min: yMin, max: Math.max(yMax, yMin + 1), step: 1,
    lo: numOr(inv.min_year, yMin), hi: numOr(inv.max_year, Math.max(yMax, yMin + 1)),
    fmt: v => String(v),
    onLo: v => { inv.min_year = v <= yMin ? "" : v; },
    onHi: v => { inv.max_year = v >= yMax ? "" : v; },
  });
}

function buildListParams() {

async function exportCsv() {

function descBlock(text) {
  const t = (text || "").trim();
  if (!t) return "";
  const long = t.length > 600;
  return `<div class="section"><h2>Description</h2>` +
    `<div class="desc${long ? " clamp" : ""}" id="descbody">${esc(t)}</div>` +
    (long ? `<div class="rowbtn"><button class="mini" onclick="document.getElementById('descbody').classList.toggle('clamp');this.textContent=this.textContent.includes('more')?'Show less':'Show more'">Show more</button></div>` : "");

function renderListing(d, from) {
  if (d.error) { showErr("Listing not found."); return; }
  const r = d.listing || {};
  const isSaved = !!d.is_saved || savedIds.has(r.ad_id);
  if (isSaved) savedIds.add(r.ad_id);
  const hist = (d.history || []).filter(h => h.price_eur != null);
  const bench = d.benchmark;
  let sparkHtml = "";
  if (hist.length >= 2) {
    const vals = hist.map(h => Number(h.price_eur));
    const max = Math.max(...vals, 1), min = Math.min(...vals);
    sparkHtml = '<div class="hist">' + vals.map(v =>
      `<div style="height:${Math.max(8, Math.round((v - min) / (max - min || 1) * 100))}%"></div>`
    ).join("") + "</div>";
  }
  const first = hist[0], last = hist[hist.length - 1];
  let trend = "";
  if (hist.length >= 2) {
    const diff = Math.round((Number(last.price_eur) / Number(first.price_eur) - 1) * 100);
    trend = `<div class="kv"><span class="k">Price trend</span>` +
      `<span class="${diff < 0 ? "trend-down" : "trend-up"}">${eur(first.price_eur)} → ${eur(last.price_eur)} (${diff > 0 ? "+" : ""}${diff} %)</span></div>`;
  }
  const ai = r.score != null
    ? `<div class="kv"><span class="k">AI score</span><span class="v">${r.score}/100</span></div>` +
      (r.why ? `<div class="kv"><span class="k">Why</span><span class="v">${esc(r.why)}</span></div>` : "") +
      (r.risk ? `<div class="kv"><span class="k">Risk</span><span class="v">${esc(r.risk)}</span></div>` : "") +
      (r.condition ? `<div class="kv"><span class="k">Condition</span><span class="v">${esc(r.condition)}</span></div>` : "") +
      (r.target_offer ? `<div class="kv"><span class="k">First offer</span><span class="v">${eur(r.target_offer)}</span></div>` : "")
    : `<div class="kv"><span class="k">AI</span><span class="muted">no score yet</span></div>`;
  let market = "";
  if (bench && bench.n && r.price_eur != null && bench.median) {
    const diff = Math.round((Number(r.price_eur) / Number(bench.median) - 1) * 100);
    const verdict = diff < 0 ? "below median" : "above median";
    const warn = bench.n < 3 ? ' <span class="badge b-warn">low data (n=' + bench.n + ")</span>"
      : (bench.trimmed ? ' <span class="muted">(outliers removed)</span>' : "");
    market = `<div class="section"><h2>Market (n=${bench.n}, year ±2)${warn}</h2><div class="card">` +
      `<div class="kv"><span class="k">Median asking price</span><span class="v">${eur(bench.median)}</span></div>` +
      `<div class="kv"><span class="k">This listing</span>` +
      `<span class="${diff < 0 ? "trend-down" : "trend-up"}">${Math.abs(diff)} % ${verdict}</span></div>` +
      `<div class="kv"><span class="k">p10 – p90</span><span class="v">${eur(bench.p10)} – ${eur(bench.p90)}</span></div></div></div>`;
  }
  const stale = staleBadge(r.last_seen_at);
  const backBtn = from === "compare"
    ? `<button class="mini" onclick="backToCompare()">‹ Back</button>`
    : `<button class="mini" onclick="backTo('${from || "listings"}')">‹ Back</button>`;
  content.innerHTML = `
    <div class="rowbtn" style="margin-top:0">
      ${backBtn}
      <button class="mini ${isSaved ? "on" : ""}" id="detail-save" onclick="toggleSave(${r.ad_id}, this, 'detail')">${isSaved ? "Saved" : "Save"}</button>
      <button class="mini" onclick="rescoreIds([${r.ad_id}])">Re-score</button>
      <a href="${esc(r.url)}" style="align-self:center">Open on Bazoš →</a>
    </div>
    <div class="section card">
      <h2 style="font-size:17px;margin-bottom:6px">${esc(r.title)}${stale}</h2>
      <div class="muted">${eur(r.price_eur)} · ${r.year ?? "?"} · ${km(r.mileage_km)} · ${esc(r.city || "?")} · listed ${fmtDateDM(r.published_date) || "?"}${r.views != null ? ` · ${r.views} views` : ""}</div>
      ${gallery(r.image_urls)}
      ${trend}
      ${sparkHtml}
    </div>
    <div class="section"><h2>AI review</h2><div class="card">${ai}</div></div>
    ${market}
    ${descBlock(r.description || r.description_preview)}`;
}

function editFallbacks(btn, current) {
  const line = document.getElementById("fb-line");
  line.innerHTML = `<input id="fb-in" maxlength="400" value="${esc(current).replace(/"/g, "&quot;")}" placeholder="model/one, model/two (max 3)" style="width:70%">` +
    ` <button class="mini on" onclick="saveFallbacks()">OK</button>`;
  const inp = document.getElementById("fb-in");
  if (inp) inp.focus();
}
async function saveFallbacks() {
  const inp = document.getElementById("fb-in");
  const r = await post("fallbacks", { models: ((inp && inp.value) || "").split(",") });
  if (r && r.ok) { buzz("ok"); load("profile"); }
  else if (r && r.error) { toast(r.error); }
}
function _fv(id) {
  const el = document.getElementById(id);
  return ((el && el.value) || "").trim();
}
async function saveFilters() {
  const r = await post("filters", { filters: {
    query: _fv("ff-q"), psc: _fv("ff-psc"), dist: _fv("ff-dist"),
    min_price: _fv("ff-minp"), max_price: _fv("ff-maxp"),
  } });
  if (r && r.ok) { buzz("ok"); toast("Scrape filters saved."); }
  else if (r && r.error) { toast(r.error); }
}
async function clearFilters() {
  const r = await post("filters", { filters: { query: "", psc: "", dist: "", min_price: "", max_price: "" } });
  if (r && r.ok) { buzz("ok"); load("profile"); }
}
async function loadModelsIntoPicker(current) {
  const data = await get(new URLSearchParams({ view: "models" }));
  const sel = document.getElementById("model-sel");
  const note = document.getElementById("models-note");
  if (!sel) return;
  if (!data || !data.models) { if (note) note.textContent = "Models unavailable."; return; }
  const free = data.models.filter(m => m.free), paid = data.models.filter(m => !m.free);
  const opt = m => `<option value="${esc(m.id)}" ${m.id === (current || data.current) ? "selected" : ""}>${esc(m.id)} · ${m.free ? "free" : "$" + m.price_in + "/M"} · ${m.rpm ? m.rpm + "/min" : "∞"}</option>`;
  sel.innerHTML = `<optgroup label="Free">${free.map(opt).join("")}</optgroup><optgroup label="Paid">${paid.map(opt).join("")}</optgroup>`;
  if (note) {
    let stamp = "";
    try { stamp = data.fetched_at ? fmtDateDM(data.fetched_at) + " " + String(data.fetched_at).slice(11, 16) : ""; } catch (e) {}
    note.textContent = `${data.models.length} JSON-capable models · list refreshed ${stamp || "?"} (daily). Fallbacks: ${(data.fallback_models || []).join(", ") || "none"}.`;
  }
}
async function setModel() {
  const sel = document.getElementById("model-sel");
  const r = await post("model", { id: (sel && sel.value) || "" });
  if (r && r.ok) { buzz("ok"); toast(r.queued ? "Model saved — re-score queued." : ("Note: " + (r.note || "already queued."))); load("profile"); }
  else if (r && r.error) { toast(r.error); }
}
async function createSearch() {
  const r = await post("search_create", { name: _fv("ns-name"), criteria: _fv("ns-crit") });
  if (r && r.ok) { buzz("ok"); load("profile"); }
  else if (r && r.error) { toast(r.error); }
}
async function deleteSearch(name) {
  const r = await post("search_delete", { name });
  if (r && r.ok) { buzz("ok"); load("profile"); }
  else if (r && r.error) { toast(r.error); }
}
async function loadTemplates() {
  const data = await get(new URLSearchParams({ view: "templates" }));
  const el = document.getElementById("tpl-list");
  if (!el) return;
  if (!data || !data.templates) { el.innerHTML = '<div class="muted">Templates unavailable.</div>'; return; }
  el.innerHTML = data.templates.map(t => `
    <div class="switch"><span>${esc(t.emoji || "")} <b>${esc(t.name)}</b><br>
      <span class="muted">${esc(t.description || "")}</span></span>
      <button class="tgl" onclick="applyTemplate('${esc(t.key)}')">Apply</button></div>`).join("");
}
async function applyTemplate(key) {
  const r = await post("template", { key });
  if (r && r.ok) { buzz("ok"); toast(r.queued ? "Template applied — re-score queued." : ("Note: " + (r.note || "already queued."))); load("profile"); }
  else if (r && r.error) { toast(r.error); }
}
async function queueEval() {
  const r = await post("eval", { limit: 100, days: 3 });
  if (r && r.ok) { buzz("ok"); toast(r.queued ? "Re-score queued." : ("Note: " + (r.note || "already queued."))); load("insights"); }
  else if (r && r.error) { toast(r.error); }
}
async function rescoreIds(ids) {
  const list = (ids || []).map(Number).filter(n => n > 0).slice(0, 20);
  if (!list.length) { toast("Nothing to re-score."); return; }
  const r = await post("rescore", { ids: list });
  if (r && r.ok) {
    buzz("ok");
    toast(r.queued ? `Re-score queued for ${list.length} car${list.length > 1 ? "s" : ""} — fresh scores, cache bypassed.` : (r.note || "Already queued."));
    load("insights");
  }
  else if (r && r.error) { toast(r.error); }
}

document.querySelectorAll(".tab").forEach(t =>
  t.addEventListener("click", () => load(t.dataset.view)));
load("listings");
</script>
