# OpenRouter LLM configuration for deal evaluation (Phase 3).
# Only the parameters this client actually sends are listed (see
# https://openrouter.ai/docs/api-reference/parameters). The API key comes from
# OPENROUTER_API_KEY (or BAZCAR_OPENROUTER_API_KEY) in .env — never here.
#
# Model routing:
#   * "openrouter/free" routes to the best available no-cost model, but is
#     rate-limited and does not aggregate quotas.
#   * "nvidia/nemotron-3-super-120b-a12b:free" = NVIDIA Nemotron reasoning
#     model, free tier (rate-limited, CoT replies are long).
#   * "~deepseek/deepseek-v4-flash-latest" = ultra-cheap (~0.00004 $/M in),
#     unthrottled (no free-tier 429), JSON-capable — recommended default.
#   * Model can also be overridden at runtime with BAZCAR_OPENROUTER_MODEL.

# Base URL of the OpenRouter Chat Completions API.
base_url: "https://openrouter.ai/api/v1"

# Model used for evaluations. See "Supported Models" on openrouter.ai.
model: "~deepseek/deepseek-v4-flash-latest"

# --- LLM parameters (sampling config) ---
temperature: 0.0 # 0..2 — 0 = deterministické skórovanie
max_tokens: 2048 # reasoning model potrebuje rezervu na chain-of-thought + JSON
top_p: 0.95 # 0..1, jadrové vzorkovanie
frequency_penalty: 0.0 # -2..2
presence_penalty: 0.0 # -2..2

# --- Output behaviour ---
# Ask for well-formed JSON only, so the evaluation always parses.
# Some free models cannot honor this; if you get errors, set it to null (disabled).
response_format: json_object

# We never stream — single-shot completion.
stream: false
