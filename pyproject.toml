[project]
name = "bazcar"
version = "0.1.0"
description = "Autonomous used-car deal finder for Bazoš.sk: scrape -> dedupe -> LLM eval -> notify -> contact."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "PyYAML>=6.0",
    "typer>=0.12",
    "asyncpg>=0.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.5",
]

[project.scripts]
bazcar = "bazcar.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bazcar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: network-dependent tests that hit real Bazoš (opt-in via -m live)",
]
addopts = "-q -m 'not live'"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# typer's canonical CLI option default idiom
"src/bazcar/cli/main.py" = ["B008"]
